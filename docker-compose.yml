services:
  postgres:
    image: postgres:16-alpine
    container_name: shop_postgres
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - shop_network

  redis:
    image: redis:7-alpine
    container_name: shop_redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${REDIS_PORT:-6378}:6378"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - shop_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: shop_server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - npm_cache_server:/root/.npm
    networks:
      - shop_network

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: development
    container_name: shop_app
    restart: unless-stopped
    env_file:
      - ./app/.env
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      - server
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
      - npm_cache_app:/root/.npm
    networks:
      - shop_network

volumes:
  postgres_data:
  redis_data:
  server_node_modules:
  app_node_modules:
  npm_cache_server:
  npm_cache_app:

networks:
  shop_network:
    driver: bridge
